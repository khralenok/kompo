<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Seeded, seamless noise: fine paper tooth over quiet tonal variation.
       Tint and opacity are baked into the image, never applied to the content. -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .30  0 0 0 0 .22  0 0 0 0 .14  .333 .333 .333 0 0"/>
    </filter>
    <filter id="fibers" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.032" numOctaves="2" seed="31" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .30  0 0 0 0 .22  0 0 0 0 .14  .333 .333 .333 0 0"/>
    </filter>
  </defs>
  <path d="M0 0h512v512H0z" filter="url(#grain)" opacity=".055"/>
  <path d="M0 0h512v512H0z" filter="url(#fibers)" opacity=".018"/>
</svg>
